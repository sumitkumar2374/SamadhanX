/>

<!-- Right abstract person -->
<circle cx="334" cy="150" r="43" fill="#8B5CF6"/>

<path
  d="M261 304
     C275 271 301 252 334 252
     C380 252 412 291 412 352"
  stroke="#8B5CF6"
  stroke-width="38"
  stroke-linecap="round"
/>

<!-- Diagonal collaboration connection -->
<path
  d="M205 214 L307 318"
  stroke="url(#bluePurple)"
  stroke-width="30"
  stroke-linecap="round"
/>

<!-- Opposite diagonal -->
<path
  d="M307 214 L205 318"
  stroke="url(#bluePurple)"
  stroke-width="30"
  stroke-linecap="round"
/>

<!-- Center connection -->
<circle cx="256" cy="266" r="16" fill="#FFFFFF"/>

