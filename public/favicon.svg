    <stop offset="0" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
</defs>

<!-- Dark navy rounded square -->
<rect width="512" height="512" rx="112" fill="#172033"/>

<!-- Left abstract person -->
